name: Pronóstico Georgia

on:
  schedule:
    - cron: '7 12 * * *'    # 08:07 ET (EDT) — antes de las 8:00 ET para evitar la congestión de la hora en punto
    - cron: '7 0 * * *'     # 20:07 ET
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Correr aunque el pronóstico ya esté congelado (después del 3-nov 10:00 ET)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pronostico-georgia             # uno por estado: con un grupo compartido, GitHub cancela las corridas en espera
                                   # (solo admite una pendiente por grupo); publicar.sh ya resuelve los choques al publicar
  cancel-in-progress: false

jobs:
  pronostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: georgia/produccion
    steps:
      - uses: actions/checkout@v4
      - name: ¿Pronóstico congelado? (día de la elección)
        id: ventana
        working-directory: .
        env:
          FORZAR_PRONOSTICO: ${{ inputs.forzar }}
        run: python3 scripts/ventana_pronostico.py
      - uses: actions/setup-python@v5
        if: steps.ventana.outputs.correr == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: georgia/produccion/requirements.txt
      - name: Instalar dependencias
        if: steps.ventana.outputs.correr == 'true'
        run: python -m pip install -r requirements.txt
      - name: Pruebas (sin red)
        if: steps.ventana.outputs.correr == 'true'
        run: python -m pytest -q -p no:cacheprovider
      - name: Correr pronóstico (fuentes en vivo)
        if: steps.ventana.outputs.correr == 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python -m ga_pronostico correr
      - name: Actualizar README
        if: steps.ventana.outputs.correr == 'true'
        run: python scripts/actualizar_readme.py
      - name: Publicar resultados (README, tablero y salidas)
        if: steps.ventana.outputs.correr == 'true'
        working-directory: .
        run: bash scripts/publicar.sh georgia "Pronóstico Georgia $(TZ=America/New_York date +'%Y-%m-%d %H:%M') ET"
