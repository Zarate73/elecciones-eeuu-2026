name: Pronóstico Florida

on:
  schedule:
    - cron: '41 10 * * *'   # 06:41 ET (05:41 desde el 1-nov, fin del horario de verano)
    - cron: '41 22 * * *'   # 18:41 ET
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Correr aunque el pronóstico ya esté congelado (después del 3-nov 10:00 ET)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pronostico-florida             # uno por estado: con un grupo compartido, GitHub cancela las corridas en espera
                                   # (solo admite una pendiente por grupo); publicar.sh ya resuelve los choques al publicar
  cancel-in-progress: false

jobs:
  pronostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: florida/produccion
    steps:
      - uses: actions/checkout@v4
      - name: ¿Pronóstico congelado? (día de la elección)
        id: ventana
        working-directory: .
        env:
          FORZAR_PRONOSTICO: ${{ inputs.forzar }}
        run: python3 scripts/ventana_pronostico.py
      - uses: actions/setup-python@v5
        if: steps.ventana.outputs.correr == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: florida/produccion/requirements.txt
      - name: Instalar dependencias
        if: steps.ventana.outputs.correr == 'true'
        run: python -m pip install -r requirements.txt
      - name: Pruebas (sin red)
        if: steps.ventana.outputs.correr == 'true'
        run: python -m pytest -q -p no:cacheprovider
      - name: Correr pronóstico (fuentes en vivo)
        if: steps.ventana.outputs.correr == 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python -m fl_pronostico correr
      - name: Actualizar README
        if: steps.ventana.outputs.correr == 'true'
        run: python scripts/actualizar_readme.py
      - name: Publicar resultados (README, tablero y salidas)
        if: steps.ventana.outputs.correr == 'true'
        working-directory: .
        run: bash scripts/publicar.sh florida "Pronóstico Florida $(TZ=America/New_York date +'%Y-%m-%d %H:%M') ET"
