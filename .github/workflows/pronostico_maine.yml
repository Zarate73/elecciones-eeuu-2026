name: Pronóstico Maine

on:
  schedule:
    - cron: '22 10 * * *'   # 06:22 ET (05:22 desde el 1-nov, fin del horario de verano)
    - cron: '22 22 * * *'   # 18:22 ET
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pronostico-repo        # mismo grupo que los demás estados: los commits de resultados no chocan
  cancel-in-progress: false

jobs:
  pronostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: maine/produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: maine/produccion/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas (sin red)
        run: python -m pytest -q -p no:cacheprovider
      - name: Correr pronóstico (fuentes en vivo)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m me_pronostico correr
      - name: Actualizar README
        run: python scripts/actualizar_readme.py
      - name: Publicar resultados (README, tablero y salidas)
        working-directory: .
        run: bash scripts/publicar.sh maine "Pronóstico Maine $(TZ=America/New_York date +'%Y-%m-%d %H:%M') ET"
