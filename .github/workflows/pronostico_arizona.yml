name: Pronóstico Arizona

on:
  schedule:
    - cron: '27 12 * * *'   # 05:27 MST (Arizona no usa horario de verano)
    - cron: '27 0 * * *'    # 17:27 MST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pronostico-repo        # mismo grupo que Georgia y California: los commits de resultados no chocan
  cancel-in-progress: false

jobs:
  pronostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: arizona/produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: arizona/produccion/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas (sin red)
        run: python -m pytest -q -p no:cacheprovider
      - name: Correr pronóstico (fuentes en vivo)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m az_pronostico correr
      - name: Actualizar README
        run: python scripts/actualizar_readme.py
      - name: Publicar resultados (README, tablero y salidas)
        working-directory: .
        run: bash scripts/publicar.sh arizona "Pronóstico Arizona $(TZ=America/Phoenix date +'%Y-%m-%d %H:%M') MST"
