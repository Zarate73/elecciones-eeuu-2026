# =====================================================================================
# Florida 2026 · configuración de producción (modelo general: V11 CON sesgo estatal contraído + terceros + mercados)
# Rutas relativas = relativas a la carpeta de producción.
# =====================================================================================

[eleccion]
estado = "Florida"
abrev = "FL"
cargo = "Gobernador"
dia_eleccion = "2026-11-03"
fecha_nominacion = "2026-08-18"        # primarias cerradas: solo cuentan encuestas que terminan después
candidato_d = "Jolly"
candidato_r = "Donalds"
nombre_d = "David Jolly"
nombre_r = "Byron Donalds"
terceros = "Terceros (Jewett, L; independientes)"
zona_horaria = "America/New_York"
recuento_pp = 0.5                      # recuento por máquina si |margen| <= 0.5 pp (ley de FL; manual si <= 0.25)

[rutas]
datos = "data"
salidas = "salidas"
logs = "logs"
# Encuestas verificadas a mano (opcional). Excel con la hoja «Gobernador Florida» (FLORIDA_GOBERNADOR-v2.xlsx) o CSV
# con columnas pollster, inicio, fin, D, R (n, pop, otros, indecisos opcionales). Vacío = solo fuentes web.
encuestas_base = "data/encuestas_verificadas_fl.csv"

[fuentes]
timeout_http_s = 30
wikipedia_api = "https://en.wikipedia.org/w/api.php"
wikipedia_pagina = "2026_Florida_gubernatorial_election"
t270_url = "https://www.270towin.com/2026-governor-polls/florida"
kalshi_api = "https://api.elections.kalshi.com/trade-api/v2"
kalshi_evento = "GOVPARTYFL-26"
kalshi_ticker_d = "GOVPARTYFL-26-D"
kalshi_ticker_r = "GOVPARTYFL-26-R"
polymarket_api = "https://gamma-api.polymarket.com"
polymarket_evento_ganador = "florida-governor-winner-2026"
polymarket_evento_margen = "florida-governor-margin-of-victory-2026"
mercado_max_dias_antiguedad = 3        # un precio más viejo no entra a la mezcla
civicapi = "https://civicapi.org/api/v2/early-vote"
civicapi_estado = "FL"
fte_raw_polls_url = "https://raw.githubusercontent.com/fivethirtyeight/data/master/pollster-ratings/2023/raw-polls.csv"
min_encuestas_vivas = 5                # menos encuestas web que esto => fuente degradada

[modelo]
ventana_dias_eleccion = 21             # encuestas que terminan en los últimos 21 días (igual que el backtest)
min_encuestadoras = 2                  # si hay menos: los 21 días previos a la encuesta más reciente
vida_media_dias = 14.0
contraccion_casa = 8.0
sesgo_estatal = true                   # backtest FL: con sesgo contraído (CRPS 2.200 vs 2.643 sin sesgo, P = 0.06)
peso_mercados = 0.30                   # promedio Kalshi + Polymarket en mezcla logit; 0 = solo encuestas
sigma_dia_pp = 0.25                    # deriva diaria si las encuestas son más viejas que el horizonte calibrado
n_simulaciones = 200000
semilla = 20261022

[ejecucion]
graficas = true
conservar_corridas = 60
