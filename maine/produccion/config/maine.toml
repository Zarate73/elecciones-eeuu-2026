# =====================================================================================
# Maine 2026 · configuración (modelo general: V11 + sesgo estatal contraído + terceros + mercados)
# Rutas relativas = relativas a la carpeta de producción.
# =====================================================================================

[eleccion]
estado = "Maine"
abrev = "ME"
cargo = "Gobernador"
dia_eleccion = "2026-11-03"
fecha_nominacion = "2026-06-09"        # primarias: solo cuentan encuestas que terminan después
candidato_d = "Pingree"
candidato_r = "Charles"
nombre_d = "Hannah Pingree"
nombre_r = "Bobby Charles"
terceros = "Terceros (Rick Bennett, I; otros)"
condado_principal = "Portland"                 # civicAPI en Maine reporta municipios
zona_horaria = "America/New_York"
recuento_pp = 0.5                      # Maine no tiene recuento automático (lo pide un candidato): se reporta P(|margen| ≤ 0.5)

[rutas]
datos = "data"
salidas = "salidas"
logs = "logs"
# Encuestas verificadas a mano (opcional). Excel con la hoja «Histórico encuestas» (MAINE_GOBERNADOR-v1.xlsx) o CSV
# con columnas pollster, inicio, fin, D, R (n, pop, otros, indecisos opcionales). Vacío = solo fuentes web.
encuestas_base = "data/encuestas_verificadas_me.csv"
# Tamaños de muestra verificados que las fuentes web no traen o traen mal (columnas clave, fin, pop, n, fuente).
# Sin corrección, un n faltante se imputa en 600 (mismo valor que la calibración) y queda marcado en n_imputado.
correcciones_n = "data/correcciones_tamano_muestra.csv"

[fuentes]
timeout_http_s = 30
wikipedia_api = "https://en.wikipedia.org/w/api.php"
wikipedia_pagina = "2026_Maine_gubernatorial_election"
t270_url = "https://www.270towin.com/2026-governor-polls/maine"
kalshi_api = "https://api.elections.kalshi.com/trade-api/v2"
kalshi_evento = "GOVPARTYME-26"
kalshi_ticker_d = "GOVPARTYME-26-D"
kalshi_ticker_r = "GOVPARTYME-26-R"
kalshi_ticker_i = "GOVPARTYME-26-RBEN"      # Rick Bennett (independiente): solo diagnóstico
polymarket_api = "https://gamma-api.polymarket.com"
polymarket_evento_ganador = "maine-governor-winner-2026"
polymarket_evento_margen = "maine-governor-margin-of-victory-2026"
mercado_max_dias_antiguedad = 3        # un precio más viejo no entra a la mezcla
civicapi = "https://civicapi.org/api/v2/early-vote"
civicapi_estado = "ME"
fte_raw_polls_url = "https://raw.githubusercontent.com/fivethirtyeight/data/master/pollster-ratings/2023/raw-polls.csv"
min_encuestas_vivas = 5                # menos encuestas web que esto => fuente degradada

[modelo]
ventana_dias_eleccion = 21             # encuestas que terminan en los últimos 21 días (igual que el backtest)
min_encuestadoras = 2                  # si hay menos: los 21 días previos a la encuesta más reciente
vida_media_dias = 14.0
contraccion_casa = 8.0
sesgo_estatal = true                   # backtest de ME: con sesgo 3.32 vs sin sesgo 3.52 (cronológico P = 0.014)
sesgo_regla = "k2"                     # sesgo sin contiendas de una sola encuestadora (ME: P = 0.99; nacional: P = 0.74)
peso_mercados = 0.30                   # promedio Kalshi + Polymarket en mezcla logit; 0 = solo encuestas
sigma_dia_pp = 0.25                    # deriva diaria si las encuestas son más viejas que el horizonte calibrado
n_simulaciones = 200000
semilla = 20261024

[ejecucion]
graficas = true
conservar_corridas = 60
