name: Pronóstico Washington D.C.

on:
  schedule:
    - cron: '14 11 * * *'   # 07:14 ET (06:14 desde el 1-nov, fin del horario de verano)
    - cron: '14 23 * * *'   # 19:14 ET
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pronostico-dc            # uno por estado: con un grupo compartido, GitHub cancela las corridas en espera
                                   # (solo admite una pendiente por grupo); publicar.sh ya resuelve los choques al publicar
  cancel-in-progress: false

jobs:
  pronostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dc/produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dc/produccion/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas (sin red)
        run: python -m pytest -q -p no:cacheprovider
      - name: Correr pronóstico (fuentes en vivo)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m dc_pronostico correr
      - name: Actualizar README
        run: python scripts/actualizar_readme.py
      - name: Publicar resultados (README, tablero y salidas)
        working-directory: .
        run: bash scripts/publicar.sh dc "Pronóstico Washington D.C. $(TZ=America/New_York date +'%Y-%m-%d %H:%M') ET"
