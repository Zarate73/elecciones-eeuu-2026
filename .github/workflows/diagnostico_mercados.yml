name: Diagnóstico mercados históricos

# Captura cruda de las mercados 2022-2024 y encuestas 2024 en la rama diagnostico-mercados (no toca main).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capturar fuentes
        run: python scripts/capturar_mercados_historicos.py
      - name: Publicar en la rama diagnostico-mercados
        run: |
          cd crudo
          git init -q -b diagnostico-mercados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Mercados históricos $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diagnostico-mercados
