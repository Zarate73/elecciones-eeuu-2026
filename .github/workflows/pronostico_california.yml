name: Pronóstico California

on:
  schedule:
    - cron: '17 12 * * *'   # 05:17 PT (PDT) · 06:17 Ciudad de México
    - cron: '17 0 * * *'    # 17:17 PT
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Correr aunque el pronóstico ya esté congelado (después del 3-nov 10:00 ET)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pronostico-california             # uno por estado: con un grupo compartido, GitHub cancela las corridas en espera
                                   # (solo admite una pendiente por grupo); publicar.sh ya resuelve los choques al publicar
  cancel-in-progress: false

jobs:
  pronostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: california/produccion
    steps:
      - uses: actions/checkout@v4
      - name: ¿Pronóstico congelado? (día de la elección)
        id: ventana
        working-directory: .
        env:
          FORZAR_PRONOSTICO: ${{ inputs.forzar }}
        run: python3 scripts/ventana_pronostico.py
      - uses: actions/setup-python@v5
        if: steps.ventana.outputs.correr == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: california/produccion/requirements.txt
      - name: Instalar dependencias
        if: steps.ventana.outputs.correr == 'true'
        run: python -m pip install -r requirements.txt
      - name: Pruebas (sin red)
        if: steps.ventana.outputs.correr == 'true'
        run: python -m pytest -q -p no:cacheprovider
      - name: Correr pronóstico (fuentes en vivo)
        if: steps.ventana.outputs.correr == 'true'
        env:
          PYTHONIOENCODING: utf-8
          PRONOSTICO_SIN_NAVEGADOR: '1'
        run: python -m ca_pronostico correr
      - name: Actualizar README
        if: steps.ventana.outputs.correr == 'true'
        run: python scripts/actualizar_readme.py
      - name: Publicar resultados (README, tablero y salidas)
        if: steps.ventana.outputs.correr == 'true'
        working-directory: .
        run: bash scripts/publicar.sh california "Pronóstico California $(TZ=America/Los_Angeles date +'%Y-%m-%d %H:%M') PT"
