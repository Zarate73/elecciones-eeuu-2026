name: Diagnóstico On Point

# Captura cruda de las fuentes de On Point Politics y civicAPI en la rama 'diagnostico-onpoint' (no toca main).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capturar fuentes
        run: python scripts/capturar_onpoint.py
      - name: Publicar en la rama diagnostico-onpoint
        run: |
          cd crudo
          git init -q -b diagnostico-onpoint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Fuentes Arizona $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diagnostico-onpoint
