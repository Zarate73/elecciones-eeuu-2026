# =====================================================================================
# Illinois 2026 · configuración (modelo general: V11 + sesgo estatal contraído + terceros + mercados)
# Rutas relativas = relativas a la carpeta de producción.
# =====================================================================================

[eleccion]
estado = "Illinois"
abrev = "IL"
cargo = "Gobernador"
dia_eleccion = "2026-11-03"
fecha_nominacion = "2026-03-17"        # primarias: solo cuentan encuestas que terminan después
candidato_d = "Pritzker"
candidato_r = "Bailey"
nombre_d = "JB Pritzker"
nombre_r = "Darren Bailey"
terceros = "Terceros (Collin Corbett, I; otros)"
condado_principal = "Cook"
zona_horaria = "America/Chicago"   # hora del centro; fija la fecha del corte
recuento_pp = 0.5                      # Illinois no tiene recuento automático (lo pide un candidato): se reporta P(|margen| ≤ 0.5)

[rutas]
datos = "data"
salidas = "salidas"
logs = "logs"
# Encuestas verificadas a mano (opcional). Excel con la hoja «Histórico encuestas» (ILLINOIS_GOBERNADOR-v1.xlsx) o CSV
# con columnas pollster, inicio, fin, D, R (n, pop, otros, indecisos opcionales). Vacío = solo fuentes web.
encuestas_base = "data/encuestas_verificadas_il.csv"
# Tamaños de muestra verificados que las fuentes web no traen o traen mal (columnas clave, fin, pop, n, fuente).
# Sin corrección, un n faltante se imputa en 600 (mismo valor que la calibración) y queda marcado en n_imputado.
correcciones_n = "data/correcciones_tamano_muestra.csv"
# Cifras de la publicación original cuando la fuente web las redondea (columnas clave, fin, pop, D, R, fuente).
correcciones_cifras = "data/correcciones_cifras.csv"

[fuentes]
timeout_http_s = 30
wikipedia_api = "https://en.wikipedia.org/w/api.php"
wikipedia_pagina = "2026_Illinois_gubernatorial_election"
t270_url = "https://www.270towin.com/2026-governor-polls/illinois"
kalshi_api = "https://api.elections.kalshi.com/trade-api/v2"
kalshi_evento = "GOVPARTYIL-26"
kalshi_ticker_d = "GOVPARTYIL-26-D"
kalshi_ticker_r = "GOVPARTYIL-26-R"
polymarket_api = "https://gamma-api.polymarket.com"
polymarket_evento_ganador = "illinois-governor-winner-2026"
polymarket_evento_margen = "illinois-governor-margin-of-victory-2026"
mercado_max_dias_antiguedad = 3        # un precio más viejo no entra a la mezcla
civicapi = "https://civicapi.org/api/v2/early-vote"
civicapi_estado = "IL"
civicapi_por_partido = false            # Illinois no tiene registro partidario: solo participación
votos_totales_eleccion_previa = 4104636 # gobernador 2022 (Junta Estatal de Elecciones de Illinois): referencia de volumen
fte_raw_polls_url = "https://raw.githubusercontent.com/fivethirtyeight/data/master/pollster-ratings/2023/raw-polls.csv"
min_encuestas_vivas = 5                # menos encuestas web que esto => fuente degradada

[modelo]
ventana_dias_eleccion = 21             # encuestas que terminan en los últimos 21 días (igual que el backtest)
min_encuestadoras = 2                  # si hay menos: los 21 días previos a la encuesta más reciente
vida_media_dias = 14.0
contraccion_casa = 8.0
sesgo_estatal = true                   # backtest de IL: sin sesgo algo mejor en IL (P = 0.63, no significativo); gana a nivel nacional (P = 0.002)
sesgo_regla = "todas"                  # cronológico de IL: «k2» empata (2.824 vs 2.827, P = 0.53)
peso_mercados = 0.30                   # promedio Kalshi + Polymarket en mezcla logit; 0 = solo encuestas
sigma_dia_pp = 0.25                    # deriva diaria si las encuestas son más viejas que el horizonte calibrado
n_simulaciones = 200000
semilla = 20261026

[ejecucion]
graficas = true
conservar_corridas = 60
