name: Pronóstico Georgia

on:
  schedule:
    - cron: '7 12 * * *'    # 08:07 ET (EDT) — antes de las 8:00 ET para evitar la congestión de la hora en punto
    - cron: '7 0 * * *'     # 20:07 ET
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pronostico-repo        # mismo grupo que California: los commits de resultados no chocan
  cancel-in-progress: false

jobs:
  pronostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: georgia/produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: georgia/produccion/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas (sin red)
        run: python -m pytest -q -p no:cacheprovider
      - name: Correr pronóstico (fuentes en vivo)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m ga_pronostico correr
      - name: Actualizar README
        run: python scripts/actualizar_readme.py
      - name: Datos del tablero
        working-directory: .
        run: python scripts/exportar_tablero.py
      - name: Publicar resultados
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tablero/datos georgia/produccion/salidas georgia/README.md README.md
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Pronóstico Georgia $(TZ=America/New_York date +'%Y-%m-%d %H:%M') ET"
            git pull --rebase --autostash -q
            git push
          fi
